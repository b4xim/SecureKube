spring:
  application:
    name: securekube-api

app:
  version: 1.0.0

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.securekube: INFO
    org.springframework: INFO

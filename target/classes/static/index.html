<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureKube API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 640px;
            width: 100%;
            padding: 2rem;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 0.25rem;
        }
        .header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .badge {
            display: inline-block;
            background: #166534;
            color: #4ade80;
            padding: 0.2rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.75rem;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card h2 {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        .endpoint {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.65rem 0;
            border-bottom: 1px solid #334155;
        }
        .endpoint:last-child { border-bottom: none; }
        .endpoint a {
            color: #38bdf8;
            text-decoration: none;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
        }
        .endpoint a:hover { text-decoration: underline; }
        .endpoint span {
            color: #64748b;
            font-size: 0.85rem;
        }
        .method {
            background: #1d4ed8;
            color: #fff;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: monospace;
            margin-right: 0.5rem;
        }
        .response-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 1rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #4ade80;
            white-space: pre;
            min-height: 2rem;
        }
        .try-btn {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .try-btn:hover { background: #475569; }
        .footer {
            text-align: center;
            color: #475569;
            font-size: 0.8rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>&#x1f6e1;&#xfe0f; SecureKube API</h1>
            <p>End-to-End DevSecOps Pipeline on AWS</p>
            <div class="badge" id="status">&#x25cf; Checking...</div>
        </div>

        <div class="card">
            <h2>API Endpoints</h2>
            <div class="endpoint">
                <div><span class="method">GET</span><a href="/api/hello">/api/hello</a></div>
                <button class="try-btn" onclick="tryEndpoint('/api/hello')">Try</button>
            </div>
            <div class="endpoint">
                <div><span class="method">GET</span><a href="/api/version">/api/version</a></div>
                <button class="try-btn" onclick="tryEndpoint('/api/version')">Try</button>
            </div>
            <div class="endpoint">
                <div><span class="method">GET</span><a href="/api/health">/api/health</a></div>
                <button class="try-btn" onclick="tryEndpoint('/api/health')">Try</button>
            </div>
        </div>

        <div class="card">
            <h2>Actuator</h2>
            <div class="endpoint">
                <div><span class="method">GET</span><a href="/actuator/health">/actuator/health</a></div>
                <button class="try-btn" onclick="tryEndpoint('/actuator/health')">Try</button>
            </div>
            <div class="endpoint">
                <div><span class="method">GET</span><a href="/actuator/info">/actuator/info</a></div>
                <button class="try-btn" onclick="tryEndpoint('/actuator/info')">Try</button>
            </div>
            <div class="endpoint">
                <div><span class="method">GET</span><a href="/actuator/metrics">/actuator/metrics</a></div>
                <button class="try-btn" onclick="tryEndpoint('/actuator/metrics')">Try</button>
            </div>
        </div>

        <div class="card">
            <h2>Response</h2>
            <div class="response-box" id="response">Click "Try" on any endpoint above</div>
        </div>

        <div class="footer">SecureKube v1.0.0 &middot; Spring Boot 3.3.2 &middot; Java 21</div>
    </div>

    <script>
        fetch('/actuator/health')
            .then(r => r.json())
            .then(d => {
                const el = document.getElementById('status');
                el.textContent = '● ' + d.status;
                el.style.background = d.status === 'UP' ? '#166534' : '#991b1b';
                el.style.color = d.status === 'UP' ? '#4ade80' : '#fca5a5';
            })
            .catch(() => {
                const el = document.getElementById('status');
                el.textContent = '● DOWN';
                el.style.background = '#991b1b';
                el.style.color = '#fca5a5';
            });

        function tryEndpoint(path) {
            const box = document.getElementById('response');
            box.textContent = 'Loading...';
            box.style.color = '#94a3b8';
            fetch(path)
                .then(r => r.json())
                .then(d => {
                    box.textContent = JSON.stringify(d, null, 2);
                    box.style.color = '#4ade80';
                })
                .catch(e => {
                    box.textContent = 'Error: ' + e.message;
                    box.style.color = '#f87171';
                });
        }
    </script>
</body>
</html>
